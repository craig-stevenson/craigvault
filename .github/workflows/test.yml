name: Tests

# The whole suite, on every push and pull request. The release workflow calls this same job,
# so there is exactly one definition of "the suite passed".
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  suite:
    name: Headless-Chrome suite
    runs-on: ubuntu-latest        # Chrome is preinstalled on this image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install websocket-client
      - name: Run the suite
        run: python3 tests/run.py
