name: Release

# Pushing a v* tag publishes one file. The suite must pass first, the tag must match the VERSION
# inside the file, and the asset is byte-identical to index.html at that tag — the "build" is cp.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the release
  id-token: write        # sign the provenance attestation (keyless, via GitHub OIDC)
  attestations: write    # store it

jobs:
  suite:
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish one proven file
    needs: suite         # no green, no release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # --generate-notes wants history; the tag object is fetched explicitly below

      - name: The tag must match the version inside the file
        run: |
          want="${GITHUB_REF_NAME#v}"
          if ! grep -q "const VERSION = \"${want}\";" index.html; then
            echo "::error::index.html does not declare VERSION \"${want}\" — bump it and re-tag"
            exit 1
          fi

      - name: Build is a copy
        run: |
          cp index.html craigvault.html
          sha256sum craigvault.html > SHA256SUMS
          cat SHA256SUMS

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: craigvault.html

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout leaves the tag peeled to its commit, so %(contents) would print the
          # commit message instead of the release summary (that is exactly what v1.0.0's notes did
          # on first publish). Fetch the tag object itself, and insist that there is one.
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag — release tags must be annotated (git tag -a) so the message becomes the notes"
            exit 1
          fi
          summary="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" craigvault.html SHA256SUMS \
            --title "CraigVault $GITHUB_REF_NAME" \
            --notes "$summary" \
            --generate-notes
